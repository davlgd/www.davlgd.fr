name: Deploy to Cellar

on:
  push:
    branches: ["main"]
    paths: "src/**"
  pull_request:
    branches: ["main"]
    paths: "src/**"
  workflow_dispatch:

env:
  HOST: https://cellar-c2.services.clever-cloud.com
  BUCKET: davlgd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install MinIO Client
        run: |
          sudo curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          sudo chmod +x /usr/local/bin/mc

      - name: Configure MinIO Cient
        run: mc alias set $BUCKET $HOST  ${{ secrets.ACCESS_KEY }} ${{ secrets.SECRET_KEY }}

      - name: Build index
        run: ./scripts/build.sh

      - name: Build sitemap
        run: ./scripts/sitemap.sh

      - name: Deploy static content on Cellar
        run: ./scripts/deploy.sh
