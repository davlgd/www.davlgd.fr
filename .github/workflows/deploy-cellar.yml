name: Deploy to Cellar

on:
  push:
    branches: ["main"]
    paths: "src/**"
  pull_request:
    branches: ["main"]
    paths: "src/**"
  workflow_dispatch:

env:
  HOST: https://cellar-c2.services.clever-cloud.com
  BUCKET: davlgd
  MC_VERSION: RELEASE.2025-08-13T08-35-41Z
  MC_SHA256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install MinIO Client
        run: |
          curl -fsSL "https://github.com/minio/mc/releases/download/${MC_VERSION}/mc.linux-amd64.${MC_VERSION}" -o mc
          echo "${MC_SHA256}  mc" | sha256sum -c -
          sudo install -m 755 mc /usr/local/bin/mc

      - name: Configure MinIO Cient
        run: mc alias set $BUCKET $HOST  ${{ secrets.ACCESS_KEY }} ${{ secrets.SECRET_KEY }}

      - name: Build index
        run: ./scripts/build.sh

      - name: Build sitemap
        run: ./scripts/sitemap.sh

      - name: Deploy static content on Cellar
        run: ./scripts/deploy.sh
